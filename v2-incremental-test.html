<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V2 Incremental Hasher Test</title>
  <script src="coi-serviceworker.min.js"></script>
  <style>
    body { font-family: monospace; max-width: 900px; margin: 2em auto; background: #1a1a2e; color: #e0e0e0; }
    h1 { color: #00d4ff; }
    .test { border: 1px solid #333; border-radius: 6px; padding: 1em; margin: 1em 0; }
    .test h2 { margin-top: 0; }
    .pass { border-color: #0f0; background: #0f01; }
    .fail { border-color: #f00; background: #f001; }
    .running { border-color: #ff0; background: #ff01; }
    .label { color: #888; }
    .hash { color: #0ff; word-break: break-all; }
    .ok { color: #0f0; font-weight: bold; }
    .err { color: #f00; font-weight: bold; }
    pre { white-space: pre-wrap; }
    #run-btn { font-size: 1.2em; padding: 0.5em 2em; cursor: pointer; background: #00d4ff; color: #000; border: none; border-radius: 4px; }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #summary { margin-top: 1em; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>V2 Incremental Hasher Tests</h1>
  <p>Tests the multi-message API: feed data via update() calls, finalize to get hash.</p>
  <button id="run-btn" onclick="runAllTests()">Run Tests</button>
  <div id="summary"></div>
  <div id="results"></div>

<script type="module">
  import { hash, createHasher } from './v2-blake3.js';
  import { V2Hasher } from './v2-hasher.js';
  import { V2IncrementalHasher } from './v2-incremental.js';

  window.runAllTests = runAllTests;

  const resultsEl = document.getElementById('results');
  const summaryEl = document.getElementById('summary');
  const runBtn = document.getElementById('run-btn');

  const BLAKE3_EMPTY = 'af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262';

  function hex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function arraysEqual(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }

  function addTest(id, title) {
    const div = document.createElement('div');
    div.className = 'test running';
    div.id = id;
    div.innerHTML = `<h2>${title}</h2><pre class="log">Running...</pre>`;
    resultsEl.appendChild(div);
    return div;
  }

  function setTestResult(div, pass, html) {
    div.className = pass ? 'test pass' : 'test fail';
    div.querySelector('.log').innerHTML = html;
  }

  function fillDeterministic(buf) {
    for (let i = 0; i < buf.length; i++) buf[i] = i & 0xFF;
  }

  async function runAllTests() {
    runBtn.disabled = true;
    resultsEl.innerHTML = '';
    summaryEl.innerHTML = '';

    let hasher, pkg;
    let passed = 0, failed = 0;

    // Init V2Hasher for ground truth
    try {
      hasher = new V2Hasher({ workerCount: 4 });
      await hasher.init();
      pkg = hasher.pkg;
    } catch (e) {
      resultsEl.innerHTML = `<div class="test fail"><h2>Init Failed</h2><pre class="log"><span class="err">${e.message}</span>\n${e.stack}</pre></div>`;
      runBtn.disabled = false;
      return;
    }

    function check(pass) { if (pass) passed++; else failed++; }

    // ═══ Test 1: Single update small (5 B "hello") ═══
    {
      const div = addTest('t1', 'Test 1 — Single update small (5 B "hello")');
      try {
        const data = new TextEncoder().encode('hello');
        const ref = await hasher.hashBuffer(data);
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        await inc.update(data);
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Incremental:</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>      <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 2: Single update large (1 MiB) ═══
    {
      const div = addTest('t2', 'Test 2 — Single update large (1 MiB, eager dispatch)');
      try {
        const data = new Uint8Array(1048576);
        fillDeterministic(data);
        const ref = await hasher.hashBuffer(data);
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        await inc.update(data);
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Incremental:</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>      <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 3: Multiple small updates ═══
    {
      const div = addTest('t3', 'Test 3 — Multiple small updates (a+b+c = concat)');
      try {
        const a = new TextEncoder().encode('hello ');
        const b = new TextEncoder().encode('world');
        const c = new TextEncoder().encode('!');
        const concat = new Uint8Array([...a, ...b, ...c]);
        const ref = await hasher.hashBuffer(concat);
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        await inc.update(a);
        await inc.update(b);
        await inc.update(c);
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Incremental:</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>      <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 4: Many tiny updates (1024 × 1 byte) ═══
    {
      const div = addTest('t4', 'Test 4 — Many tiny updates (1024 × 1 byte)');
      try {
        const full = new Uint8Array(1024);
        fillDeterministic(full);
        const ref = await hasher.hashBuffer(full);
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        for (let i = 0; i < 1024; i++) {
          await inc.update(new Uint8Array([full[i]]));
        }
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Updates:</span> 1024 × 1 byte\n` +
          `<span class="label">Incremental:</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>      <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 5: Mixed sizes (3B + 100KiB + 7B) ═══
    {
      const div = addTest('t5', 'Test 5 — Mixed sizes (3B + 100KiB + 7B)');
      try {
        const partA = new Uint8Array([0x01, 0x02, 0x03]);
        const partB = new Uint8Array(102400);
        fillDeterministic(partB);
        const partC = new Uint8Array([0xAA, 0xBB, 0xCC, 0xDD, 0xEE, 0xFF, 0x42]);
        const concat = new Uint8Array(partA.length + partB.length + partC.length);
        concat.set(partA, 0);
        concat.set(partB, partA.length);
        concat.set(partC, partA.length + partB.length);
        const ref = await hasher.hashBuffer(concat);
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        await inc.update(partA);
        await inc.update(partB);
        await inc.update(partC);
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Parts:</span> 3B + 100KiB + 7B = ${concat.length} B\n` +
          `<span class="label">Incremental:</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>      <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 6: Empty finalize ═══
    {
      const div = addTest('t6', 'Test 6 — Empty finalize (no updates)');
      try {
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        const result = await inc.finalize();
        inc.destroy();
        const h = hex(result);
        const pass = h === BLAKE3_EMPTY;
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Result:</span>   <span class="hash">${h}</span>\n` +
          `<span class="label">Expected:</span> <span class="hash">${BLAKE3_EMPTY}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 7: update() after finalize() throws ═══
    {
      const div = addTest('t7', 'Test 7 — update() after finalize() throws');
      try {
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        await inc.update(new TextEncoder().encode('test'));
        await inc.finalize();
        let threw = false;
        try {
          await inc.update(new TextEncoder().encode('more'));
        } catch (e) {
          threw = true;
        }
        inc.destroy();
        check(threw);
        setTestResult(div, threw,
          `<span class="label">update() after finalize():</span> ${threw ? 'threw Error as expected' : 'did NOT throw'}\n` +
          (threw ? '<span class="ok">PASS</span>' : '<span class="err">FAIL — should have thrown</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 8: Reset and reuse ═══
    {
      const div = addTest('t8', 'Test 8 — Reset and reuse');
      try {
        const dataA = new TextEncoder().encode('first message');
        const dataB = new TextEncoder().encode('second message');
        const refA = await hasher.hashBuffer(dataA);
        const refB = await hasher.hashBuffer(dataB);

        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        await inc.update(dataA);
        const resultA = await inc.finalize();
        const matchA = arraysEqual(resultA, refA);

        inc.reset();
        await inc.update(dataB);
        const resultB = await inc.finalize();
        const matchB = arraysEqual(resultB, refB);
        inc.destroy();

        const pass = matchA && matchB;
        check(pass);
        setTestResult(div, pass,
          `<span class="label">First hash:</span>  <span class="hash">${hex(resultA)}</span>\n` +
          `<span class="label">Expected:</span>     <span class="hash">${hex(refA)}</span>\n` +
          `<span class="label">Match A:</span> ${matchA ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          `<span class="label">Second hash:</span> <span class="hash">${hex(resultB)}</span>\n` +
          `<span class="label">Expected:</span>     <span class="hash">${hex(refB)}</span>\n` +
          `<span class="label">Match B:</span> ${matchB ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 9: createHasher() convenience API ═══
    {
      const div = addTest('t9', 'Test 9 — createHasher() convenience (v2-blake3.js)');
      try {
        const data = new TextEncoder().encode('createHasher test');
        const ref = await hash(data);
        const inc = await createHasher();
        await inc.update(data);
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">createHasher():</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>         <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // ═══ Test 10: Backpressure (16 × 64 KiB = 1 MiB) ═══
    {
      const div = addTest('t10', 'Test 10 — Backpressure (16 × 64 KiB = 1 MiB, slot cycling)');
      try {
        const full = new Uint8Array(1048576);
        fillDeterministic(full);
        const ref = await hasher.hashBuffer(full);
        const inc = new V2IncrementalHasher({ pool: hasher.pool, pkg, wasmMemory: hasher.wasmMemory });
        await inc.init();
        for (let i = 0; i < 16; i++) {
          await inc.update(full.subarray(i * 65536, (i + 1) * 65536));
        }
        const result = await inc.finalize();
        inc.destroy();
        const pass = arraysEqual(result, ref);
        check(pass);
        setTestResult(div, pass,
          `<span class="label">Updates:</span> 16 × 64 KiB (cycles through ${hasher.pool.workerCount} slots)\n` +
          `<span class="label">Incremental:</span> <span class="hash">${hex(result)}</span>\n` +
          `<span class="label">hash():</span>      <span class="hash">${hex(ref)}</span>\n` +
          `<span class="label">Match:</span> ${pass ? '<span class="ok">YES</span>' : '<span class="err">NO</span>'}\n` +
          (pass ? '<span class="ok">PASS</span>' : '<span class="err">FAIL</span>')
        );
      } catch (e) { check(false); setTestResult(div, false, `<span class="err">Error:</span> ${e.message}\n${e.stack}`); }
    }

    // Cleanup
    hasher.destroy();

    // Summary
    const allPass = failed === 0;
    summaryEl.innerHTML = allPass
      ? `<span class="ok">${passed}/${passed} tests passed</span>`
      : `<span class="err">${failed} failed</span>, <span class="ok">${passed} passed</span> of ${passed + failed}`;

    runBtn.disabled = false;
  }
</script>
</body>
</html>
